services:
  postgres:
    image: postgres:16-alpine
    container_name: ccbill_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ccbill}
      POSTGRES_USER: ${POSTGRES_USER:-ccbill}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME_postgres_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ccbill} -d ${POSTGRES_DB:-ccbill}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ccbill_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-CHANGE_ME_redis_password} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-CHANGE_ME_redis_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ccbill_backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ccbill}:${POSTGRES_PASSWORD:-CHANGE_ME_postgres_password}@postgres:5432/${POSTGRES_DB:-ccbill}
      SYNC_DATABASE_URL: postgresql://${POSTGRES_USER:-ccbill}:${POSTGRES_PASSWORD:-CHANGE_ME_postgres_password}@postgres:5432/${POSTGRES_DB:-ccbill}
      REDIS_URL: redis://:${REDIS_PASSWORD:-CHANGE_ME_redis_password}@redis:6379/0
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: ccbill_worker
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ccbill}:${POSTGRES_PASSWORD:-CHANGE_ME_postgres_password}@postgres:5432/${POSTGRES_DB:-ccbill}
      SYNC_DATABASE_URL: postgresql://${POSTGRES_USER:-ccbill}:${POSTGRES_PASSWORD:-CHANGE_ME_postgres_password}@postgres:5432/${POSTGRES_DB:-ccbill}
      REDIS_URL: redis://:${REDIS_PASSWORD:-CHANGE_ME_redis_password}@redis:6379/0
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ccbill_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  nginx:
    image: nginx:1.25-alpine
    container_name: ccbill_nginx
    restart: unless-stopped
    ports:
      - "4000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  uploads_data:
    driver: local
